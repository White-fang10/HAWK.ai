version: "3.9"

services:
  backend:
    build: ./backend
    container_name: hawkai_backend
    ports:
      - "8000:8000"
    volumes:
      - hawk_data:/app/data
      - hawk_models:/root/.hawk_models
    environment:
      - DATABASE_URL=sqlite:///./data/attendance.db
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - RTSP_URL=${RTSP_URL:-}
      - USE_NEURAL_SR=${USE_NEURAL_SR:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: .
    container_name: hawkai_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/attendance
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hawk_data:
    name: hawk_data
  hawk_models:
    name: hawk_models
